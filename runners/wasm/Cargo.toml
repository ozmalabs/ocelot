[package]
name = "substrate-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly runner and browser bindings for the OCELOT (G, Γ, C) cognitive substrate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substrate-rs = { path = "../dsl", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
rustc-hash = "2.1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
