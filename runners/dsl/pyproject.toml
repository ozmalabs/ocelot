[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "substrate_rs"
version = "0.1.0"
description = "Rust runtime for the (G, Γ) substrate DSL — drop-in replacement for `substrate/`"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "substrate_rs._native"
