[package]
name = "substrate-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "substrate_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
smallvec = { version = "1.13", features = ["union"] }
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
ahash = "0.8"
# Compressed bitmap sets — used for declared attr_indices and the
# set-algebra Term operations. Compresses dense node-id sets by ~30×
# vs Vec<NodeID> and runs AND/OR/NOT/popcount in SIMD.
roaring = "0.10"
# FFT for the STFT "second ear" — a frequency-sharp auditory front-end
# complementary to the gammatone bank. Used by audio_primitives::stft.
rustfft = "6"
# Runtime x86_64 assembler for the JIT path. Macro emits encoding
# logic at Rust compile time; the runtime walks Term-trees and calls
# the emitter to produce executable bytes. Used by Wasmtime / Lucet
# in production. Linux x86_64 only for now; the JIT is gated behind
# `#[cfg(all(target_arch = "x86_64", target_os = "linux"))]`.
dynasmrt = "2.0"
dynasm = "2.0"
# wgpu compute path for motion estimation. Off by default — Python
# wheels still build vanilla without a GPU stack. Enable with the
# `gpu_me` feature.
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.16", optional = true, features = ["derive"] }
# CPU affinity for the L2 work-stealing scheduler. Pin worker threads
# to physical cores (avoiding SMT siblings for hot-path reflexes) on
# the hardware Jabberwock's vocabulary identified as ideal — see
# scripts/jabberwock_optimal_runner_for_this_system.py.
core_affinity = "0.8"
# Lock-free work-stealing deque used by l2_dispatch_work_stealing —
# implements the per-Mt local queue + steal pattern the L2 Mt names
# under `tradeoff_hot_counter_locality`. Closes the bench-2 throughput
# gap (commit fe93761) by removing the single-Mutex bottleneck.
crossbeam-deque = "0.8"
# Deterministic indexed parallel iteration for immutable batch-rule matching.
# Effects still fold serially in authored binding order.
rayon = "1.10"
# POSIX shm_open for the framebuffer vision primitive's reader side
# (framebuffer.rs). Already a transitive dep (dynasmrt/core_affinity
# pull it in — see Cargo.lock) so promoting it to a direct dep pins no
# new version.
libc = "0.2"
# mmap wrapper for the same primitive. Also already transitive
# (pulled in by an existing dep) — promoted to direct, no new version.
memmap2 = "0.5"

[features]
default = []
# Build with the un-tuned baseline CABAC renorm loop. Used to
# measure the hand-tune speedup head-to-head. Off in production.
cabac_baseline = []
# Enable wgpu-based motion estimation. Adds the wgpu/pollster
# dependencies. Build with `--features gpu_me`.
gpu_me = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# AVX-512 fast paths (l1_hot_paths.rs::find_attr_sym_avx512, l3_lqr.rs's
# mul_avx512 / mul_bf16_inner / mul_bf16_pre_b_inner). OFF by default:
# `stdarch_x86_avx512` (rust-lang/rust#111137) and `avx512_target_feature`
# (rust-lang/rust#44839) are unstable on this crate's baseline toolchain
# (confirmed unstable through at least rustc 1.87.0; confirmed stabilized
# by rustc 1.97.1 per docs/research/program_synthesis/
# PROGRAM_SYNTHESIS_ARC6_WIRE_HANDS.md SS6 -- exact stabilizing release
# in between not pinned here). Building WITH this feature still requires
# EITHER a nightly toolchain (the crate opts into the two unstable
# features above via `#![cfg_attr(feature = "avx512", feature(...))]` in
# lib.rs, which nightly accepts and pre-1.9x stable rejects) OR a stable
# toolchain new enough to have stabilized both gates -- plus AVX-512F
# (and, for the BF16 matmul path, AVX-512BF16) capable hardware, e.g. the
# AMD Ryzen 9600X (Zen 5) this fast path was originally tuned for. Build
# with: `cargo build --release --features avx512` on such a toolchain.
# Default build (this feature off) uses the scalar/FP64 fallback paths
# only and compiles on any stable rustc with a plain x86_64/other target.
avx512 = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
