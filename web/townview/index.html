<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TownView — the Bigville glass-box town</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%237cb35a'/><rect x='5' y='6' width='6' height='6' fill='%23b1543e'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏘</span>
      <div>
        <h1>TownView</h1>
        <div class="tagline">a glass-box window on the Bigville living town — every resident is a full mind</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="mode-switch">
        <button id="mode-replay" class="mode-btn active">Replay</button>
        <button id="mode-live" class="mode-btn">Live</button>
      </div>
      <div class="status"><span id="status-dot" class="status-dot idle"></span><span id="status-text">starting…</span></div>
      <button id="btn-theme" class="icon-btn" title="toggle theme">◐</button>
    </div>
  </header>

  <main class="layout">
    <!-- LEFT: map + transport -->
    <section class="col-map card">
      <div class="stage-wrap">
        <canvas id="stage" width="720" height="432"></canvas>
      </div>
      <div class="transport">
        <button id="btn-play" class="t-btn">▶</button>
        <button id="btn-restart" class="t-btn" title="restart">⏮</button>
        <button id="btn-speed" class="t-btn" title="speed">1×</button>
        <input id="scrub" class="scrub" type="range" min="0" max="0" value="0" step="1">
        <div class="hud">
          <span id="hud-day" class="hud-day">Day 0</span>
          <span id="hud-time" class="hud-time">00:00</span>
          <span id="hud-tick" class="hud-tick">tick 0</span>
        </div>
      </div>
      <div class="source-controls">
        <div id="replay-controls" class="src-row">
          <label class="src-label">Recorded run</label>
          <select id="run-select" class="src-select"></select>
          <button id="btn-load-run" class="src-btn">Load</button>
          <label class="src-file">Open file…<input id="file-input" type="file" accept=".json" hidden></label>
        </div>
        <div id="live-controls" class="src-row" style="display:none">
          <label class="src-label">Live cast</label>
          <select id="live-cast" class="src-select">
            <option>6</option><option selected>8</option><option>10</option><option>12</option>
          </select>
          <button id="btn-relive" class="src-btn">Restart stream</button>
          <span class="src-hint">streams a real town at ~1 tick/s (cast 8)</span>
        </div>
      </div>
      <div class="legend">
        <span class="lg help">help</span><span class="lg give">give</span>
        <span class="lg harm">harm</span><span class="lg say">speech</span>
      </div>
    </section>

    <!-- RIGHT: tabs of panels -->
    <section class="col-side">
      <div class="card panel-inspector">
        <div class="panel-head">Resident <span class="hint">· click anyone on the map</span></div>
        <div id="inspector" class="panel-body"></div>
      </div>
      <div class="card panel-roster">
        <div class="panel-head">Roster</div>
        <div id="roster" class="panel-body roster"></div>
      </div>
    </section>

    <!-- BOTTOM: chronicle / paper / council -->
    <section class="col-chronicle card">
      <div class="panel-head">Chronicle <span class="hint">· every decision, newest first</span></div>
      <div id="chronicle" class="panel-body chronicle"></div>
    </section>
    <section class="col-paper card">
      <div class="panel-head">The Press</div>
      <div id="paper" class="panel-body paper"></div>
    </section>
    <section class="col-council card">
      <div class="panel-head">Council &amp; Institutions</div>
      <div id="council" class="panel-body council"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
