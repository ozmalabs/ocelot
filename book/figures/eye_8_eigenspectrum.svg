<text x="470.00" y="218.00" class="note" text-anchor="start">It is a blob: aligned with DC almost</text>
<text x="470.00" y="232.00" class="note" text-anchor="start">perfectly, carrying almost no</text>
<text x="470.00" y="246.00" class="note" text-anchor="start">orientation at all.</text>
<text x="470.00" y="278.00" class="lbl" text-anchor="start">And under it, a tie</text>
<text x="470.00" y="296.00" class="val" text-anchor="start">λ₂/λ₃ = 1.0907 [1.0668, 1.1145]</text>
<text x="470.00" y="312.00" class="note" text-anchor="start">Remove DC and what remains is a</text>
<text x="470.00" y="326.00" class="note" text-anchor="start">near-degenerate pair — so preferred</text>
<text x="470.00" y="340.00" class="note" text-anchor="start">orientation is a coin flip.</text>
<text x="46.00" y="372.00" class="lbl" text-anchor="start">This is arithmetic, not a tuning failure</text>
<text x="46.00" y="392.00" class="note" text-anchor="start">Oja fits second-order statistics. The orientation in these waves is local and sign-varying, and it is</text>
<text x="46.00" y="407.00" class="note" text-anchor="start">not in the second-order statistics — so no learning rate rescues it, and the missing cortical layer</text>
<text x="46.00" y="422.00" class="note" text-anchor="start">was BUILT to check whether the published mechanism would, and it did not. Five pre-registered rungs</text>
<text x="46.00" y="437.00" class="note" text-anchor="start">were then retired rather than re-tuned.</text>
<text x="46.00" y="464.00" class="lbl" text-anchor="start">What the null redirected the work TO</text>
<text x="46.00" y="482.00" class="note" text-anchor="start">The 3D world was never in a still image — it is in the relations between frames, and those the</text>
<text x="46.00" y="496.00" class="note" text-anchor="start">substrate CAN discover (EYE-5). Biology agrees: the motion path is early and central.</text>
<text x="46.00" y="526.00" class="cap" text-anchor="start">Source: results/waveiso_confirm.json (M_eigenvalues, per seed) · generator: book/figures/fig_eye_eigenspectrum.py</text>
