<text x="46.00" y="322.00" class="lbl" text-anchor="start">What this is evidence OF</text>
<text x="46.00" y="342.00" class="note" text-anchor="start">Three categories of constant, and only the first is evidence: one that FELL OUT of a natural process;</text>
<text x="46.00" y="357.00" class="note" text-anchor="start">one PUT IN as a constant, which fails on distribution shift; and one put in AS ARCHITECTURE — a</text>
<text x="46.00" y="372.00" class="note" text-anchor="start">signature exactly one rule is solely responsible for, which is silently unfalsifiable and the worst</text>
<text x="46.00" y="387.00" class="note" text-anchor="start">of the three. This slope is the first kind. The receptor was given a logarithm because Weber&#x27;s law</text>
<text x="46.00" y="402.00" class="note" text-anchor="start">is one; the slope of 0.9991 is what that choice already implied, measured afterwards.</text>
<text x="46.00" y="432.00" class="lbl" text-anchor="start">The contrast arm</text>
<text x="46.00" y="450.00" class="note" text-anchor="start">The linear receptor&#x27;s slope on the same axes is 91,150 — it does not encode a ratio at all.</text>
<text x="46.00" y="476.00" class="cap" text-anchor="start">Source: results/eye_confirm.log (H2) · generator: book/figures/fig_eye_weber.py</text>
