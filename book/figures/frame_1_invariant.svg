<text x="46.00" y="324.00" class="lbl" text-anchor="start">Why in-frame MUST be integer</text>
<text x="46.00" y="344.00" class="note" text-anchor="start">Sampling is what grounding is. An observed frame is stepped by construction, so a float in an</text>
<text x="46.00" y="359.00" class="note" text-anchor="start">object&#x27;s coordinates is a category error, not extra precision. The engine already enforces this:</text>
<text x="46.00" y="374.00" class="note" text-anchor="start">coord_ints returns None on a Float slot — a refusal that is load-bearing, not a gap to be filled.</text>
<text x="46.00" y="408.00" class="lbl" text-anchor="start">Continuity is intensional only</text>
<text x="46.00" y="428.00" class="note" text-anchor="start">A continuous quantity is a rule you APPLY, never a datum you observe. A map may carry a real</text>
<text x="46.00" y="443.00" class="note" text-anchor="start">parameter intensionally; its observable is always the stepped rendering. You can apply π — but any</text>
<text x="46.00" y="458.00" class="note" text-anchor="start">given circle is stepped, and pinning a parameter finer than the steps support is encoding precision</text>
<text x="46.00" y="473.00" class="note" text-anchor="start">the observation cannot carry.</text>
<text x="46.00" y="496.00" class="cap" text-anchor="start">Conceptual figure — no data behind it. Source: CLAUDE.md § BASE-AS-DIMENSION and shape_decode.rs::coord_ints.</text>
<text x="46.00" y="510.00" class="cap" text-anchor="start">Generator: book/figures/fig_frame_invariant.py</text>
