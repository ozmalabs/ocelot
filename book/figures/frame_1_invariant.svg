<text x="390.00" y="189.00" class="note" text-anchor="middle">Fourier · log · a comparison metric · a rendering</text>
<text x="390.00" y="206.00" class="note" text-anchor="middle" fill="var(--accent)">REAL-VALUED, and correctly so</text>
