<text x="516.00" y="196.00" class="note" text-anchor="start">wear 0.003 · back to grass</text>
<text x="516.00" y="212.00" class="note" text-anchor="start">Reversion needs no second field: the</text>
<text x="516.00" y="226.00" class="note" text-anchor="start">target is the terrain the cell was</text>
<text x="516.00" y="240.00" class="note" text-anchor="start">seeded as. A formed path is never</text>
<text x="516.00" y="254.00" class="note" text-anchor="start">confused with a built one.</text>
<line x1="46.00" y1="300.00" x2="734.00" y2="300.00" stroke="var(--rule)" stroke-width="0.8" stroke-linecap="round"/>
<text x="46.00" y="322.00" class="lbl" text-anchor="start">Why the smooth line is the finding</text>
<text x="46.00" y="342.00" class="note" text-anchor="start">The terrain flips to path at the end, but the cost has been falling the whole way — 1.0000, 0.9038,</text>
<text x="46.00" y="357.00" class="note" text-anchor="start">0.8075, 0.7113, 0.6500. That interpolation is the feedback loop: part-worn ground is already easier</text>
<text x="46.00" y="372.00" class="note" text-anchor="start">to cross, so traffic recruits traffic. Under a threshold-only rule the wear would be invisible until it</text>
<text x="46.00" y="387.00" class="note" text-anchor="start">tripped, and there would be nothing for the population to converge on.</text>
<text x="46.00" y="402.00" class="note" text-anchor="start"></text>
<text x="46.00" y="417.00" class="note" text-anchor="start">Route choice is cognition and lives in a rule. Ground wearing under load is physics and lives in the</text>
<text x="46.00" y="432.00" class="note" text-anchor="start">world. The split is the design.</text>
<text x="46.00" y="476.00" class="cap" text-anchor="start">Source: TERRAIN_WEAR_STIGMERGY_RESULTS.md §2 (bigville, external repository) · generator: book/figures/fig_town_wear.py</text>
