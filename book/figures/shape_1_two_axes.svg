<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img"><style>
:root{--ink:#16181d;--muted:#5b6270;--rule:#c8cdd6;--arm-a:#1f6f8b;
--arm-b:#b4531f;--accent:#2f7d4f;--null:#8a8f99;--bg:transparent}
@media (prefers-color-scheme:dark){:root{--ink:#e6e8ec;--muted:#9aa1ae;
--rule:#3a4049;--arm-a:#5fb6d4;--arm-b:#e08a52;--accent:#6fc08d;--null:#767c86}}
text{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
fill:var(--ink)}
.lbl{font-size:12px}.tick{font-size:11px;fill:var(--muted)}
.ttl{font-size:15px;font-weight:600}.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;fill:var(--muted)}
.note{font-size:11.5px;fill:var(--muted)}
.val{font-size:11.5px;font-weight:600}
</style>
<text x="46.00" y="34.00" class="ttl" text-anchor="start">Shape and Rule are two axes, not two candidates</text>
<text x="46.00" y="50.00" class="sub" text-anchor="start">Rule is how a substrate runs. Shape is how it grows.</text>
<rect x="190.00" y="76.00" width="420.00" height="220.00" rx="3" fill="var(--rule)" fill-opacity="0.05" stroke="none"/>
<line x1="190.00" y1="296.00" x2="610.00" y2="296.00" stroke="var(--rule)" stroke-width="1.2" stroke-linecap="round"/>
<line x1="190.00" y1="76.00" x2="190.00" y2="296.00" stroke="var(--rule)" stroke-width="1.2" stroke-linecap="round"/>
<text x="400.00" y="318.00" class="lbl" text-anchor="middle">RULE  —  execution</text>
<text x="400.00" y="333.00" class="note" text-anchor="middle">match, where, effects · the run_rules fixpoint</text>
<text x="168.00" y="186.00" class="lbl" text-anchor="middle" transform="rotate(-90 168.00 186.00)">SHAPE  —  acquisition</text>
<text x="182.00" y="186.00" class="note" text-anchor="middle" transform="rotate(-90 182.00 186.00)">decode, residual, mint</text>
<rect x="196.00" y="192.00" width="198.00" height="98.00" rx="3" fill="var(--null)" fill-opacity="0.05" stroke="none"/>
<text x="208.00" y="214.00" class="lbl" text-anchor="start">neither</text>
<text x="208.00" y="230.00" class="val" text-anchor="start" fill="var(--null)">inert</text>
<text x="208.00" y="250.00" class="note" text-anchor="start">holds nothing, does nothing</text>
<rect x="406.00" y="192.00" width="198.00" height="98.00" rx="3" fill="var(--arm-b)" fill-opacity="0.1" stroke="none"/>
<text x="418.00" y="214.00" class="lbl" text-anchor="start">rule without shape</text>
<text x="418.00" y="230.00" class="val" text-anchor="start" fill="var(--arm-b)">executes, cannot grow itself</text>
<text x="418.00" y="250.00" class="note" text-anchor="start">can only be extended by a human</text>
<text x="418.00" y="264.00" class="note" text-anchor="start">deciding, by hand, that this</text>
<text x="418.00" y="278.00" class="note" text-anchor="start">case deserves a new rule</text>
<rect x="196.00" y="82.00" width="198.00" height="98.00" rx="3" fill="var(--arm-b)" fill-opacity="0.1" stroke="none"/>
<text x="208.00" y="104.00" class="lbl" text-anchor="start">shape without rule</text>
<text x="208.00" y="120.00" class="val" text-anchor="start" fill="var(--arm-b)">learns, cannot act</text>
<text x="208.00" y="140.00" class="note" text-anchor="start">a codebook nobody consults</text>
<rect x="406.00" y="82.00" width="198.00" height="98.00" rx="3" fill="var(--arm-a)" fill-opacity="0.1" stroke="none"/>
<text x="418.00" y="104.00" class="lbl" text-anchor="start">both</text>
<text x="418.00" y="120.00" class="val" text-anchor="start" fill="var(--arm-a)">grows its own execution layer</text>
<text x="418.00" y="140.00" class="note" text-anchor="start">a residual mints an entry;</text>
<text x="418.00" y="154.00" class="note" text-anchor="start">the next decode covers more;</text>
<text x="418.00" y="168.00" class="note" text-anchor="start">the loop is the growth</text>
<line x1="46.00" y1="356.00" x2="734.00" y2="356.00" stroke="var(--rule)" stroke-width="0.8" stroke-linecap="round"/>
<text x="46.00" y="378.00" class="lbl" text-anchor="start">The sharp version of the claim</text>
<text x="46.00" y="398.00" class="note" text-anchor="start">A substrate whose own execution layer has no shape cannot expand its own execution layer. That is</text>
<text x="46.00" y="413.00" class="note" text-anchor="start">narrower and more testable than &#x27;rules should be tidier&#x27; — and it was measured: this agent selected</text>
<text x="46.00" y="428.00" class="note" text-anchor="start">which of its own rules to modify by counting substring matches against the rule&#x27;s NAME, with the</text>
<text x="46.00" y="443.00" class="note" text-anchor="start">rule&#x27;s body opaque to that selection. Structural and name-keyword selection differ on both sides of a</text>
<text x="46.00" y="458.00" class="note" text-anchor="start">hand-verified oracle (11/12 vs 0/12, and 12/12 vs 0/12, N = 40). Neither subsumes the other.</text>
<text x="46.00" y="496.00" class="cap" text-anchor="start">Conceptual figure — the measured slice behind it is RULE_SIGNATURE_SLICE_RESULTS.md. Generator: fig_shape_and_rule.py</text>
</svg>
