<text x="46.00" y="344.00" class="lbl" text-anchor="start">Reading the two rows together</text>
<text x="46.00" y="364.00" class="note" text-anchor="start">Globally, the ensemble sits almost on the isotropic floor: no orientation is preferred across the</text>
<text x="46.00" y="379.00" class="note" text-anchor="start">whole field, and that half of the shared premise is CONFIRMED — measured, for the first time.</text>
<text x="46.00" y="394.00" class="note" text-anchor="start">Locally, coherence sits far above the disks floor and most of the way to the bars ideal: the waves</text>
<text x="46.00" y="409.00" class="note" text-anchor="start">are travelling FRONTS, and a front is oriented where it passes. That half of the premise is REFUTED.</text>
<text x="46.00" y="446.00" class="lbl" text-anchor="start">Why this matters two figures later</text>
<text x="46.00" y="464.00" class="note" text-anchor="start">The inference three rungs had drawn — no orientation in the input, therefore none can be learned —</text>
<text x="46.00" y="478.00" class="note" text-anchor="start">does not follow. The structure is present. The next figure shows what cannot see it, and why.</text>
<text x="46.00" y="506.00" class="cap" text-anchor="start">Source: results/waveiso_confirm.json · runners scripts/waveiso_{lib,calibrate,pilot,confirm}.py · generator: fig_eye_waves.py</text>
