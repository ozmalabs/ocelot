<text x="46.00" y="358.00" class="note" text-anchor="start">As noise rises, total gain WEAKENS (0.7748 → 0.6447, Δ -0.1301) and the surround</text>
<text x="46.00" y="372.00" class="note" text-anchor="start">BROADENS — the far-ring share rises (0.3332 → 0.3932, Δ +0.0600). Both directions were</text>
<text x="46.00" y="386.00" class="note" text-anchor="start">predicted by the theory before the run, and neither is a parameter of this retina.</text>
<text x="46.00" y="424.00" class="lbl" text-anchor="start">The instrument was checked before the result was believed</text>
<text x="46.00" y="442.00" class="note" text-anchor="start">An analytic control split that MUST score zero scores 4.44e-16 across 8 seeds → PASS.</text>
<text x="46.00" y="456.00" class="note" text-anchor="start">This tree&#x27;s standing hazard is the inert instrument — a measure that passes noise, a reader that</text>
<text x="46.00" y="470.00" class="note" text-anchor="start">always says yes. The floor is measured, not assumed.</text>
<text x="46.00" y="504.00" class="cap" text-anchor="start">A later rung qualifies what this retina could go on to SUPPORT — its input alphabet is binarised downstream</text>
<text x="46.00" y="518.00" class="cap" text-anchor="start">(VISION_FAILURE_MODES_RESULTS.md) — which is why this figure reports only what emerged here.</text>
<text x="46.00" y="532.00" class="cap" text-anchor="start">Source: results/rung7_confirm.log · runner scripts/rung7_confirm.py · generator: fig_eye_centre_surround.py</text>
