<text x="46.00" y="463.00" class="lbl" text-anchor="start">What the shape of this table is for</text>
<text x="46.00" y="483.00" class="note" text-anchor="start">Two entries are not clean passes, and both are reported as what they are. R5 clears three of four</text>
<text x="46.00" y="498.00" class="note" text-anchor="start">recovery metrics; the fourth is a null with overlapping intervals, mechanistically explained and</text>
<text x="46.00" y="513.00" class="note" text-anchor="start">pre-registered as the likely outcome BEFORE the confirmatory run. V1 is interval-separated and does</text>
<text x="46.00" y="528.00" class="note" text-anchor="start">NOT flip sign — the abuser stays net-favoured even with the incident channel visible.</text>
<text x="46.00" y="543.00" class="note" text-anchor="start"></text>
<text x="46.00" y="558.00" class="note" text-anchor="start">The falsification bar across all fifteen: no rung may invent a bespoke mechanism. The line closes with</text>
<text x="46.00" y="573.00" class="note" text-anchor="start">zero new engine primitives and zero new decision logic — every dynamic here is what ordinary,</text>
<text x="46.00" y="588.00" class="note" text-anchor="start">independently-motivated components do when connected in a particular way.</text>
<text x="46.00" y="611.00" class="cap" text-anchor="start">Numbers in the chapter text, copied from each rung&#x27;s own gated results document. Ethics protocol quoted in full at §12.1.</text>
