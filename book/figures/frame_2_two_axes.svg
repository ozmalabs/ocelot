<line x1="143.00" y1="139.00" x2="157.00" y2="139.00" stroke="var(--arm-b)" stroke-width="1.4" stroke-linecap="round"/>
<text x="136.00" y="143.00" class="note" text-anchor="end" fill="var(--muted)">depth 2</text>
