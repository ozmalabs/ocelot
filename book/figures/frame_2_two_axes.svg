<text x="46.00" y="34.00" class="ttl" text-anchor="start">Two unbounded directions, and you cannot get from one to the other</text>
<text x="46.00" y="50.00" class="sub" text-anchor="start">Both are unbounded for the same reason. Only one of them can reach a continuum.</text>
