<text x="350.00" y="186.00" class="note" text-anchor="start" fill="var(--muted)">no amount of stepping outward arrives here</text>
<text x="350.00" y="201.00" class="note" text-anchor="start" fill="var(--muted)">a countable union of countable steps stays countable</text>
<line x1="46.00" y1="358.00" x2="734.00" y2="358.00" stroke="var(--rule)" stroke-width="0.8" stroke-linecap="round"/>
<text x="46.00" y="380.00" class="lbl" text-anchor="start">Why both are unbounded, and why it is the same reason</text>
<text x="46.00" y="400.00" class="note" text-anchor="start">Neither is stored complete. What is held is the finite observed part, plus the fact that it does not</text>
<text x="46.00" y="415.00" class="note" text-anchor="start">end — which is a representable fact, not a gap in the representation. Unknowability is the shared</text>
<text x="46.00" y="430.00" class="note" text-anchor="start">cause; cardinality is what separates them. This is also the epilogue&#x27;s argument in miniature: a</text>
<text x="46.00" y="445.00" class="note" text-anchor="start">substrate with two unbounded axes has no completion condition, so any ending is a chosen cut.</text>
<text x="46.00" y="476.00" class="cap" text-anchor="start">Conceptual figure — no data behind it. Source: CLAUDE.md § BASE-AS-DIMENSION. Generator: book/figures/fig_two_axes.py</text>
