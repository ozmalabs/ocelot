<line x1="143.00" y1="98.69" x2="157.00" y2="98.69" stroke="var(--arm-b)" stroke-width="1.4" stroke-linecap="round"/>
<text x="136.00" y="102.00" class="lbl" text-anchor="end" fill="var(--muted)">⋮</text>
<text x="168.00" y="100.00" class="lbl" text-anchor="start">INTENSIVE — refinement</text>
<text x="168.00" y="116.00" class="note" text-anchor="start">always another step BETWEEN two you have</text>
<text x="168.00" y="131.00" class="val" text-anchor="start" fill="var(--arm-b)">its unreachable limit is the continuum (𝔠)</text>
<path d="M 400 254 C 400 200, 300 170, 166 150" fill="none" stroke="var(--null)" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 4"/>
