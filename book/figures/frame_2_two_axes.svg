<text x="150.00" y="294.00" class="lbl" text-anchor="start">EXTENSIVE — the frontier</text>
<text x="150.00" y="310.00" class="note" text-anchor="start">one more step outward · unknown = absence, first-class</text>
<text x="150.00" y="325.00" class="val" text-anchor="start" fill="var(--arm-a)">countable (ℕ)</text>
<line x1="150.00" y1="268.00" x2="150.00" y2="88.00" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
