<text x="46.00" y="282.00" class="lbl" text-anchor="start">Why this is a derivation and not a design choice</text>
<text x="46.00" y="302.00" class="note" text-anchor="start">Weber&#x27;s law IS a logarithm of an intensity ratio. Take the log at the receptor and the ratio survives</text>
<text x="46.00" y="317.00" class="note" text-anchor="start">a change of illumination while the absolute level does not — so invariance is not a feature added to</text>
<text x="46.00" y="332.00" class="note" text-anchor="start">the eye, it is what taking the log already means. The measured gap is a factor of about 1000.</text>
<text x="46.00" y="362.00" class="lbl" text-anchor="start">The half of the gate that makes it a result</text>
<text x="46.00" y="382.00" class="note" text-anchor="start">The linear arm sits at 100% of floor — a full mismatch. That is the positive control:</text>
<text x="46.00" y="397.00" class="note" text-anchor="start">a measure that reported near-zero for BOTH arms would be inert, and would prove nothing.</text>
<text x="46.00" y="430.00" class="cap" text-anchor="start">Floor = patdiff between two DIFFERENT probe scenes at the same illumination (log arm: 0.20788).</text>
<text x="46.00" y="444.00" class="cap" text-anchor="start">Source: results/eye_confirm.log · prereg VISION_EYE_PREREG.md, committed before the run · generator: book/figures/fig_eye_invariance.py</text>
