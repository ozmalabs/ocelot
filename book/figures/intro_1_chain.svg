<svg xmlns="http://www.w3.org/2000/svg" width="780" height="636" viewBox="0 0 780 636" role="img"><style>
:root{--ink:#16181d;--muted:#5b6270;--rule:#c8cdd6;--arm-a:#1f6f8b;
--arm-b:#b4531f;--accent:#2f7d4f;--null:#8a8f99;--bg:transparent}
@media (prefers-color-scheme:dark){:root{--ink:#e6e8ec;--muted:#9aa1ae;
--rule:#3a4049;--arm-a:#5fb6d4;--arm-b:#e08a52;--accent:#6fc08d;--null:#767c86}}
text{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
fill:var(--ink)}
.lbl{font-size:12px}.tick{font-size:11px;fill:var(--muted)}
.ttl{font-size:15px;font-weight:600}.sub{font-size:12px;fill:var(--muted)}
.cap{font-size:11px;fill:var(--muted)}
.note{font-size:11.5px;fill:var(--muted)}
.val{font-size:11.5px;font-weight:600}
</style>
<text x="46.00" y="34.00" class="ttl" text-anchor="start">How I got here</text>
<text x="46.00" y="50.00" class="sub" text-anchor="start">Twelve links. Every arrow is the same question asked again, one scale up.</text>
<circle cx="60.00" cy="83.00" r="5.4" fill="none" fill-opacity="1.0" stroke="var(--null)" stroke-width="1.6"/>
<line x1="60.00" y1="90.00" x2="60.00" y2="112.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="82.00" class="lbl" text-anchor="start">a boring meeting</text>
<text x="78.00" y="97.00" class="note" text-anchor="start">play games through it; blend both audio streams</text>
<circle cx="60.00" cy="121.00" r="5.4" fill="none" fill-opacity="1.0" stroke="var(--null)" stroke-width="1.6"/>
<line x1="60.00" y1="128.00" x2="60.00" y2="150.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="120.00" class="lbl" text-anchor="start">no good KVM+A exists</text>
<text x="78.00" y="135.00" class="note" text-anchor="start">hardware is clunky, software is duct tape</text>
<circle cx="60.00" cy="159.00" r="5.4" fill="var(--arm-a)" fill-opacity="1.0" stroke="var(--arm-a)" stroke-width="1.6"/>
<line x1="60.00" y1="166.00" x2="60.00" y2="188.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="158.00" class="lbl" text-anchor="start">so build one</text>
<text x="78.00" y="173.00" class="note" text-anchor="start">a software-defined KVMA router; the USB never moves</text>
<text x="734.00" y="158.00" class="val" text-anchor="end" fill="var(--muted)">2026-04-01</text>
<circle cx="60.00" cy="197.00" r="5.4" fill="var(--arm-a)" fill-opacity="1.0" stroke="var(--arm-a)" stroke-width="1.6"/>
<line x1="60.00" y1="204.00" x2="60.00" y2="226.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="196.00" class="lbl" text-anchor="start">the problem keeps growing</text>
<text x="78.00" y="211.00" class="note" text-anchor="start">keyboard = video = audio = network = power</text>
<circle cx="60.00" cy="235.00" r="5.4" fill="var(--arm-a)" fill-opacity="1.0" stroke="var(--arm-a)" stroke-width="1.6"/>
<line x1="60.00" y1="242.00" x2="60.00" y2="264.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="234.00" class="lbl" text-anchor="start">one typed map</text>
<text x="78.00" y="249.00" class="note" text-anchor="start">labelled things, labelled connections, any scale</text>
<text x="734.00" y="234.00" class="val" text-anchor="end" fill="var(--muted)">77k-word spec</text>
<circle cx="60.00" cy="273.00" r="5.4" fill="var(--arm-a)" fill-opacity="1.0" stroke="var(--arm-a)" stroke-width="1.6"/>
<line x1="60.00" y1="280.00" x2="60.00" y2="302.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="272.00" class="lbl" text-anchor="start">the tooling bill</text>
<text x="78.00" y="287.00" class="note" text-anchor="start">every model-to-model link needs bespoke glue</text>
<circle cx="60.00" cy="311.00" r="5.4" fill="var(--arm-a)" fill-opacity="1.0" stroke="var(--arm-a)" stroke-width="1.6"/>
<line x1="60.00" y1="318.00" x2="60.00" y2="340.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="310.00" class="lbl" text-anchor="start">a semiotic layer for models</text>
<text x="78.00" y="325.00" class="note" text-anchor="start">a protocol; the shared knowledge base is, again, a map</text>
<circle cx="60.00" cy="349.00" r="5.4" fill="var(--arm-b)" fill-opacity="1.0" stroke="var(--arm-b)" stroke-width="1.6"/>
<line x1="60.00" y1="356.00" x2="60.00" y2="378.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="348.00" class="lbl" text-anchor="start">THE COLLISION</text>
<text x="78.00" y="363.00" class="note" text-anchor="start">the KVMA map and the model map are the SAME map</text>
<text x="734.00" y="348.00" class="val" text-anchor="end" fill="var(--muted)">unplanned</text>
<circle cx="60.00" cy="387.00" r="5.4" fill="var(--arm-b)" fill-opacity="1.0" stroke="var(--arm-b)" stroke-width="1.6"/>
<line x1="60.00" y1="394.00" x2="60.00" y2="416.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="386.00" class="lbl" text-anchor="start">the key is not the graph — it is Γ</text>
<text x="78.00" y="401.00" class="note" text-anchor="start">what matters is what the map is ALLOWED to become</text>
<circle cx="60.00" cy="425.00" r="5.4" fill="var(--arm-b)" fill-opacity="1.0" stroke="var(--arm-b)" stroke-width="1.6"/>
<line x1="60.00" y1="432.00" x2="60.00" y2="454.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="424.00" class="lbl" text-anchor="start">so the model was scaffolding</text>
<text x="78.00" y="439.00" class="note" text-anchor="start">if Γ generates and the substrate realises, no LLM is needed</text>
<circle cx="60.00" cy="463.00" r="5.4" fill="var(--accent)" fill-opacity="1.0" stroke="var(--accent)" stroke-width="1.6"/>
<line x1="60.00" y1="470.00" x2="60.00" y2="492.00" stroke="var(--rule)" stroke-width="1.4" stroke-linecap="round"/>
<text x="78.00" y="462.00" class="lbl" text-anchor="start">then physics</text>
<text x="78.00" y="477.00" class="note" text-anchor="start">the tick was already possibility-then-realise; QM is where the distinction is irreducible</text>
<text x="734.00" y="462.00" class="val" text-anchor="end" fill="var(--muted)">2026-04-25</text>
<circle cx="60.00" cy="501.00" r="5.4" fill="var(--accent)" fill-opacity="1.0" stroke="var(--accent)" stroke-width="1.6"/>
<text x="78.00" y="500.00" class="lbl" text-anchor="start">collapse leaves residual</text>
<text x="78.00" y="515.00" class="note" text-anchor="start">which is the spine of everything after this</text>
<line x1="46.00" y1="542.00" x2="734.00" y2="542.00" stroke="var(--rule)" stroke-width="0.8" stroke-linecap="round"/>
<text x="46.00" y="564.00" class="lbl" text-anchor="start">The method, which is the point</text>
<text x="46.00" y="582.00" class="note" text-anchor="start">&quot;What are the unnamed assumptions here?&quot; — asked of the answer, repeatedly, until the answer stops</text>
<text x="46.00" y="596.00" class="note" text-anchor="start">changing. It took about ten passes to believe the word &quot;everything&quot;, because every scope word</text>
<text x="46.00" y="610.00" class="note" text-anchor="start">smuggled in a boundary: in computing, on the planet. Ten passes is a mint, not a delay.</text>
</svg>
