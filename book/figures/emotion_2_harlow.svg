<text x="46.00" y="252.00" class="lbl" text-anchor="start">Why it is not a weight thumb</text>
<text x="46.00" y="272.00" class="note" text-anchor="start">Both drives carry weight 1. The infant rides the real drive system (contact_comfort, hunger,</text>
<text x="46.00" y="287.00" class="note" text-anchor="start">distress), the real regulator, and the real appraisal Argmax — nothing in this experiment was</text>
<text x="46.00" y="302.00" class="note" text-anchor="start">built for it. Contact wins for a structural reason: it is needed continuously, and it alone</text>
<text x="46.00" y="317.00" class="note" text-anchor="start">buffers the threat channel.</text>
<text x="46.00" y="344.00" class="lbl" text-anchor="start">The control</text>
<text x="46.00" y="364.00" class="note" text-anchor="start">Ablate the contact drive and the preference does not shrink — it goes to 0%, interval width zero.</text>
<text x="46.00" y="379.00" class="note" text-anchor="start">The behaviour was carried by that drive and nothing else was quietly supplying it.</text>
<text x="46.00" y="406.00" class="cap" text-anchor="start">Source: results/harlow_d1.json · prereg HARLOW_D1_PREREG.md, committed before measurement</text>
<text x="46.00" y="420.00" class="cap" text-anchor="start">Generator: book/figures/fig_harlow_preference.py</text>
