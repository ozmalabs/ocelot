<text x="46.00" y="404.00" class="note" text-anchor="start">Every post-composition delta — AbS +3.7, dwell, appearance +2.5, rel2 −3.8, sub-stroke −1.2 — sits</text>
<text x="46.00" y="419.00" class="note" text-anchor="start">inside the intervals at power. One change recorded as a LOSER (rel2) is numerically on top. What</text>
<text x="46.00" y="434.00" class="note" text-anchor="start">survives is composition, +21pp over multiset, and it survives because it was large enough to be</text>
<text x="46.00" y="449.00" class="note" text-anchor="start">visible without error bars — which is luck, not method.</text>
