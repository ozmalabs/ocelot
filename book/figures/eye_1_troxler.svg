<text x="46.00" y="424.00" class="cap" text-anchor="start">Two timescales, derived independently and never tuned to each other: τ_drift = 3 (the self-avoiding walk)</text>
<text x="46.00" y="438.00" class="cap" text-anchor="start">and τ_adapt = 160 (from μ_endo) — a factor of 53 apart. The fade here is retinal; the biological locus is</text>
<text x="46.00" y="452.00" class="cap" text-anchor="start">multi-level (retinal-transient, retinal-sustained, cortical filling-in), so the eye is an instrument for</text>
<text x="46.00" y="466.00" class="cap" text-anchor="start">weighting those contributions, not a claim that one of them wins.</text>
