<text x="46.00" y="372.00" class="lbl" text-anchor="start">What the ablation shows</text>
<text x="46.00" y="392.00" class="note" text-anchor="start">Remove the self-avoiding term and the short lag barely moves (1.1553 → 1.1944) while the long lag</text>
<text x="46.00" y="407.00" class="note" text-anchor="start">crosses back over one (0.7590 → 1.1301). The walk stops anti-correlating at long lag — it becomes</text>
<text x="46.00" y="422.00" class="note" text-anchor="start">ordinary diffusion. So the crossover is carried by that term specifically, and the drift is doing</text>
<text x="46.00" y="437.00" class="note" text-anchor="start">work rather than decorating the retina.</text>
<text x="46.00" y="464.00" class="lbl" text-anchor="start">The retraction behind this figure</text>
<text x="46.00" y="482.00" class="note" text-anchor="start">This drift reproduced the published signature to two decimals while driving NOTHING — its only</text>
<text x="46.00" y="496.00" class="note" text-anchor="start">consumer was the ruler that measured it — until it was wired into the image. Kept in the record.</text>
<text x="46.00" y="530.00" class="cap" text-anchor="start">Source: results/eye_confirm.log (H3) · generator: book/figures/fig_eye_drift.py</text>
