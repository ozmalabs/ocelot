<text x="452.00" y="290.00" class="note" text-anchor="start">Accuracy is flat at zero — nothing was</text>
<text x="452.00" y="304.00" class="note" text-anchor="start">learned. And surprise converges ANYWAY:</text>
<text x="452.00" y="318.00" class="note" text-anchor="start">the agent confidently re-predicts its own</text>
<text x="452.00" y="332.00" class="note" text-anchor="start">wrong recognition.</text>
