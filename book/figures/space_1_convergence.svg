<text x="46.00" y="398.00" class="lbl" text-anchor="start">Why the second panel is the result</text>
<text x="46.00" y="418.00" class="note" text-anchor="start">A system that stops being surprised has not thereby learned anything. Under heavy noise this one</text>
<text x="46.00" y="433.00" class="note" text-anchor="start">converges on its own mistake and reports no surprise at all — so a surprise-only gate would pass a</text>
<text x="46.00" y="448.00" class="note" text-anchor="start">run in which perception had failed completely. The accuracy gate catches it, and that is what makes</text>
<text x="46.00" y="463.00" class="note" text-anchor="start">the clean panel evidence rather than a curve: the instrument can fail, and it was shown failing.</text>
<text x="46.00" y="494.00" class="cap" text-anchor="start">Confirmed hypotheses 6.000 [6.000, 6.000]; frac_model_complete 1.000 [0.867, 1.000]; median complete-cycle 5.</text>
