<text x="46.00" y="424.00" class="cap" text-anchor="start">Each arm holds one cause FIXED and varies the other — the dissolution the human experiment cannot run, because in</text>
<text x="46.00" y="438.00" class="cap" text-anchor="start">children temperament and learned reliability arrive together. Both null controls behaved: hold the varying cause</text>
<text x="46.00" y="452.00" class="cap" text-anchor="start">constant and the intervals overlap, as pre-registered.</text>
<text x="46.00" y="466.00" class="cap" text-anchor="start">This is a CAPABILITY demonstration — that the substrate can separate the two causes over one value economy — and</text>
<text x="46.00" y="480.00" class="cap" text-anchor="start">NOT an empirical claim about real children.</text>
<text x="46.00" y="494.00" class="cap" text-anchor="start">Source: results/marshmallow_delay/results.json · generator: book/figures/fig_marshmallow_confound.py</text>
