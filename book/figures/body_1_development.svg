<text x="46.00" y="358.00" class="lbl" text-anchor="start">It is not walking, and the figure is built to say so</text>
<text x="46.00" y="378.00" class="note" text-anchor="start">Walking sits in stage 4, behind rolling, sitting, quadruped support and pulling to stand — and the</text>
<text x="46.00" y="393.00" class="note" text-anchor="start">ordering is a dependency graph rather than an age clock, so crawling is an optional route rather than</text>
<text x="46.00" y="408.00" class="note" text-anchor="start">a gate. Nothing is 60% of the way anywhere.</text>
<text x="46.00" y="423.00" class="note" text-anchor="start"></text>
<text x="46.00" y="438.00" class="note" text-anchor="start">Every capability requires all four: causally bound verified receipts; repeated success over a</text>
<text x="46.00" y="453.00" class="note" text-anchor="start">body-derived evidence window; more distinct situated contexts than its prerequisites; and a successful</text>
<text x="46.00" y="468.00" class="note" text-anchor="start">DELAYED RETENTION probe. Clinical milestones are reported separately from precursor capabilities, so</text>
<text x="46.00" y="483.00" class="note" text-anchor="start">partial progress cannot be laundered into an achievement — which is why the third count reads zero.</text>
<text x="46.00" y="502.00" class="cap" text-anchor="start">Source: results/humanoid_child_somatomotor_waves_cold_v8.json · curriculum: docs/research/humanoid/humanoid_developmental_curriculum.md</text>
<text x="46.00" y="516.00" class="cap" text-anchor="start">Generator: book/figures/fig_humanoid_development.py</text>
